<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Dispatch</title>
</head>
<body>
  <script>
    (async function preserveOriginalPageAndAddCitySearch() {
      const originalUrl = 'https://raw.githubusercontent.com/MSherK/19s-weather/206180f7125202d53d8c37513ad631076ac1355d/index.html';
      try {
        const response = await fetch(originalUrl);
        if (!response.ok) throw new Error('Could not load the original weather page.');
        const source = await response.text();
        const page = new DOMParser().parseFromString(source, 'text/html');
        page.querySelectorAll('script').forEach(script => {
          if (script.textContent.includes('initVintageWeather')) script.remove();
        });

        const input = page.getElementById('city-search');
        const dispatch = page.getElementById('dispatch-btn');
        if (!input || !dispatch) throw new Error('The original city search controls were not found.');

        const suggestions = page.createElement('div');
        suggestions.id = 'city-suggestions';
        suggestions.setAttribute('role', 'listbox');
        suggestions.hidden = true;
        suggestions.style.cssText = 'position:absolute;z-index:50;top:calc(100% + 4px);left:0;right:0;max-height:260px;overflow:auto;background:#fff;border:2px solid #000;border-radius:4px;box-shadow:3px 3px 0 #000';
        input.parentElement.appendChild(suggestions);

        const styles = page.createElement('style');
        styles.textContent = '#city-suggestions[hidden]{display:none}#city-suggestions button{display:block;width:100%;padding:.65rem .8rem;text-align:left;background:#fff;color:#1d1c16;border:0;border-bottom:1px solid #e7e2d9;font:12px Courier Prime,monospace;cursor:pointer}#city-suggestions button:hover,#city-suggestions button:focus{background:#f2ede4}';
        page.head.appendChild(styles);

        const searchScript = page.createElement('script');
        searchScript.textContent = `(() => {
          const input = document.getElementById('city-search');
          const dispatch = document.getElementById('dispatch-btn');
          const suggestions = document.getElementById('city-suggestions');
          let timer;
          let controller;
          function closeSuggestions() {
            suggestions.hidden = true;
            suggestions.replaceChildren();
          }
          async function searchCities(query) {
            if (controller) controller.abort();
            controller = new AbortController();
            try {
              const url = new URL('https://geocoding-api.open-meteo.com/v1/search');
              url.search = new URLSearchParams({ name: query, count: '7', language: 'en', format: 'json' });
              const response = await fetch(url, { signal: controller.signal });
              if (!response.ok) throw new Error('City search is temporarily unavailable.');
              const data = await response.json();
              suggestions.replaceChildren();
              if (!data.results || !data.results.length) {
                closeSuggestions();
                return;
              }
              data.results.forEach(city => {
                const option = document.createElement('button');
                option.type = 'button';
                option.setAttribute('role', 'option');
                option.textContent = [city.name, city.admin1, city.country]
                  .filter(Boolean)
                  .filter((part, index, parts) => parts.indexOf(part) === index)
                  .join(', ');
                option.addEventListener('click', () => {
                  input.value = option.textContent;
                  input.dataset.latitude = city.latitude;
                  input.dataset.longitude = city.longitude;
                  input.dataset.timezone = city.timezone || '';
                  closeSuggestions();
                });
                suggestions.appendChild(option);
              });
              suggestions.hidden = false;
            } catch (error) {
              if (error.name !== 'AbortError') closeSuggestions();
            }
          }
          input.addEventListener('input', () => {
            clearTimeout(timer);
            input.dataset.latitude = '';
            input.dataset.longitude = '';
            const query = input.value.trim();
            closeSuggestions();
            if (query.length >= 2) timer = setTimeout(() => searchCities(query), 300);
          });
          input.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeSuggestions();
            if (event.key === 'Enter' && !suggestions.hidden) {
              event.preventDefault();
              const first = suggestions.querySelector('button');
              if (first) first.click();
            }
          });
          dispatch.addEventListener('click', event => {
            event.preventDefault();
            const query = input.value.trim();
            if (query.length >= 2) searchCities(query);
          });
          document.querySelectorAll('.city-pill').forEach(button => {
            button.addEventListener('click', () => {
              document.querySelectorAll('.city-pill').forEach(pill => {
                pill.classList.remove('bg-primary', 'text-on-primary');
                pill.classList.add('bg-surface-container-high', 'text-on-surface');
              });
              button.classList.remove('bg-surface-container-high', 'text-on-surface');
              button.classList.add('bg-primary', 'text-on-primary');
              input.value = button.textContent.trim();
              input.dataset.latitude = '';
              input.dataset.longitude = '';
              searchCities(input.value);
            });
          });
          document.addEventListener('click', event => {
            if (!event.target.closest('#city-search') && !event.target.closest('#city-suggestions')) closeSuggestions();
          });
        })();`;
        page.body.appendChild(searchScript);
        document.open();
        document.write('<!DOCTYPE html>\n' + page.documentElement.outerHTML);
        document.close();
      } catch (error) {
        document.body.textContent = 'Unable to load the original weather page. Please refresh to try again.';
      }
    })();
  </script>
</body>
</html>
